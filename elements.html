<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script><title>Element Database</title>

<style>
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgb(62, 49, 159);
    font-family:'Segoe UI',sans-serif;
    flex-direction: column;
    background-image: url(https://i.pinimg.com/originals/36/00/02/360002e4690d7889f7a3ca2ea406ea15.gif);
    background-size: cover;
    font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

.container{
    max-width:700px;
}

.lookup{
    margin-top:20px;
}

.card-box{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    color:white;
}

h1{
    font-weight:700;
    margin-bottom:15px;
    color: rgb(148, 145, 216);
    padding-top: 20px;
}

p{
    font-size:1rem;
}

input{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    border-radius:12px;
    margin-bottom:15px;
}

button{
    background:rgb(66, 59, 199);
    border:none;
    padding:12px 25px;
    border-radius:12px;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    background:#361282;
    transform:translateY(-3px);
}

.lookup p{
    background:rgba(255,255,255,0.15);
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

span{
    color:rgb(53, 49, 120);
    font-weight:bold;
}

p{
    color: aliceblue;
}

nav {
        width: 80%;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 100px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        height: 70px;
        background:rgb(62, 49, 159);
        opacity: 70%;
    }

nav a {
        text-decoration: none;
        color: rgb(193, 189, 248);
        font-size: 16px;
        font-weight: 600;
        transition: 0.5px;
    }

nav a:hover{
    color:rgb(255, 255, 255);
}

nav ul {
        list-style: none;
        margin: 0;
        padding: 10px;
    }   

.footer {

    left: 0;
    bottom: 0;
    width: 100%;
    background-color: rgb(62, 49, 159);
    text-align: center;
    opacity: 70%;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

} 

</style>

<nav>

    <ul>
        <li>
            <a href="index.html">Current ICT Club Members</a>
        </li>
    </ul>

    <ul>
        <li>
            <a href="addnewmember.html">Sign up for ICT club</a>
        </li>
    </ul>

    <ul>
        <li>
            <a href="elements.html">Element Database</a>
        </li>
    </ul>

    <ul>
        <li>
            <a href="Index.html">Meet the Creator</a>
        </li>
    </ul>

    </nav>


</head>


<body>

    

    <center>
    <div class="container">
    <h1>Find any non-metal here!</h1>
    <p style="color: rgb(148, 145, 216);">Enter a nonmetal to search</p>

    <input type="text" id="nonmetal" placeholder="Example: H">

    <br>
    <br>


    <button py-click="find_nonmetal" style="color: rgb(148, 145, 216);;">Find nonmetal</button>
    <div class="lookup">

    <br>
        <h1>Non-metal Properties</h1>
    <br>

    
    <p><b style="color: rgb(148, 145, 216);">Non-metal Code:</b><span id="nonmetalcode"></span></p>
    <p><b style="color: rgb(148, 145, 216);">Non-metal Symbol:</b><span id="symbol"></span></p>
    <p><b style="color: rgb(148, 145, 216);">Non-metal Element:</b><span id="element"></span></p>
    <p><b style="color: rgb(148, 145, 216);">Atomic Number:</b><span id="atomic number"></span></p>
    <p><b style="color: rgb(148, 145, 216);">Atmoic Mass:</b><span id="atomic mass"></span></p>

    <div class="lookup"></div>
    </div>
    <script type="py" src="main.py"></script>
    </center>
</body>
</html>
